<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Консоль администратора</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo"><span class="logo__text">Kuz<span class="logo__accent">Potato</span></span></a>
            <div class="header__actions">
                <button class="btn btn--outline-dark" onclick="window.location='index.html'">На сайт</button>
            </div>
        </div>
    </header>

    <main class="admin-console">
        <div class="container admin-console__inner">
            <div class="admin-console__head">
                <h1>Консоль администратора</h1>
                <div>
                    <button class="btn btn--gold" id="addProductBtn">Добавить товар</button>
                </div>
            </div>

            <div id="adminNotice" class="admin-notice"></div>

            <section id="productFormWrapper" class="product-form-wrapper" style="display:none;">
                <form id="productForm" class="product-form">
                    <label>Название
                        <input id="prodTitle" type="text" required>
                    </label>
                    <label>Описание
                        <textarea id="prodDescription"></textarea>
                    </label>
                    <label>Цена
                        <input id="prodPrice" type="number" step="0.01" value="0">
                    </label>
                    <label>Примечание
                        <input id="prodNote" type="text">
                    </label>
                    <label>Фото товара
                        <input id="prodImageFile" type="file" accept="image/*">
                    </label>
                    <div style="display:flex;gap:10px;margin-top:12px;">
                        <button class="btn btn--gold" id="submitProductBtn" type="button">Создать товар</button>
                        <button class="btn" id="deleteProductBtn" type="button" style="display:none;background:#ffefef;color:#a00;border-color:#f4c2c2;">Удалить</button>
                        <button class="btn" id="cancelProductBtn" type="button">Отмена</button>
                    </div>
                    <div id="productUploadStatus" style="margin-top:8px;color:var(--brown-muted)"></div>
                </form>
            </section>

            <section id="productsList" class="products-list">
                <!-- products will be rendered here -->
            </section>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.loadAdminConsole && window.loadAdminConsole();
        });
    </script>
</body>
</html>
