<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" id="header">
        <div class="container header__inner">
            <a href="index.html" class="logo">
                <span class="logo__text">Kuz<span class="logo__accent">Potato</span></span>
            </a>
            <nav class="nav" id="nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link nav__link--active">Главная</a></li>
                    <li><a href="catalog.html" class="nav__link">Каталог</a></li>
                    <li><a href="about.html" class="nav__link">О компании</a></li>
                    <li><a href="delivery.html" class="nav__link">Доставка</a></li>
                    <li><a href="contacts.html" class="nav__link">Контакты</a></li>
                </ul>
            </nav>
            <div class="header__actions">
                <a href="cart.html" class="cart-icon" id="cartIcon" aria-label="Корзина">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    <span class="cart-icon__badge" id="cartBadge">0</span>
                </a>
                <button class="burger" id="burger" aria-label="Меню">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="profile-page">
        <div class="container profile-page__inner">
            <div id="profileCard" class="profile-card"></div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.loadUserProfile && window.loadUserProfile();
        });
    </script>
</body>
</html>
