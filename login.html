<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
<div class="login-box">
  <div class="login-logo">Kuz<span class="logo__accent">Potato</span></div>
  <h2>Вход</h2>
  <div id="serverNotice" style="color:#c00; margin-bottom:16px; font-size:0.95rem;"></div>
  <input id="email" placeholder="логин">
  <input id="pass" type="password" placeholder="пароль">
  <button onclick="login()">Войти</button>
  <button onclick="register()">Регистрация</button>
</div>

<script>
const serverNotice = document.getElementById('serverNotice');

async function checkServer(){
  if (window.location.protocol === 'file:') {
    serverNotice.textContent = 'Страница открыта локально. Запустите сервер и откройте ее по адресу http://localhost:3000/login.html';
    document.querySelectorAll('button').forEach(btn => btn.disabled = true);
    return;
  }

  try {
    const resp = await fetch('/api/me');
    if (!resp.ok) throw new Error('Сервер недоступен');
  } catch (e) {
    serverNotice.textContent = 'Сервер не запущен или недоступен. Запустите проект командой python server.py и откройте страницу по адресу http://localhost:3000/login.html';
    document.querySelectorAll('button').forEach(btn => btn.disabled = true);
  }
}

checkServer();

async function login(){
  if (window.location.protocol === 'file:') {
    document.getElementById('serverNotice').textContent = 'Страница открыта локально. Запустите сервер и откройте ее по адресу http://localhost:3000/login.html';
    return;
  }

  const email=document.getElementById('email').value;
  const password=document.getElementById('pass').value;

  if(!email || !password){
    alert('Заполните все поля');
    return;
  }

  try{
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const d=await r.json();
    
    if(r.ok && d.email){
      // store per-tab using sessionStorage and include token for API calls
      try{ sessionStorage.setItem('user', JSON.stringify(d)); }catch(e){}
      window.location='index.html';
    } else {
      alert('Ошибка: ' + (d.error || 'Неверные данные'));
    }
  }catch(e){
    alert('Ошибка подключения: ' + e.message);
  }
}

async function register(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('pass').value;

  if(!email || !password){
    alert('Заполните все поля');
    return;
  }

  if(password.length < 6){
    alert('Пароль должен быть не менее 6 символов');
    return;
  }

  if (window.location.protocol === 'file:') {
    document.getElementById('serverNotice').textContent = 'Страница открыта локально. Запустите сервер и откройте ее по адресу http://localhost:3000/login.html';
    return;
  }

  try{
    const r=await fetch('/api/register',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const d=await r.json();
    
    if(r.ok){
      alert('Регистрация успешна! Теперь вы можете войти.');
      document.getElementById('email').value='';
      document.getElementById('pass').value='';
    } else {
      alert('Ошибка: ' + (d.error || 'Пользователь уже существует'));
    }
  }catch(e){
    alert('Ошибка подключения: ' + e.message);
  }
}
</script>
</body>
</html>
